<style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.delay{animation-delay:.7s}.delay2{animation-delay:1.4s}@media(prefers-reduced-motion:reduce){.float{animation:none}}</style>
