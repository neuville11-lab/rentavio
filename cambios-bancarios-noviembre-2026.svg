<g transform="translate(80 422)"><rect width="222" height="82" rx="18" fill="#00c896"/><text x="111" y="34" text-anchor="middle" fill="#06483c" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">REVISIÓN OFICIAL</text><text x="111" y="64" text-anchor="middle" fill="#063e34" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">8 NOV 2026</text></g>
