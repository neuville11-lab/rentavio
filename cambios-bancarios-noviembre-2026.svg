<text x="74" y="205" fill="#fff" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="66" letter-spacing="-2">Cambios bancarios</text>
<text x="74" y="282" fill="#fff" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="66" letter-spacing="-2">que importan</text>
