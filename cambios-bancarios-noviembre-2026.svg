<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Actualizaciones bancarias de noviembre de 2026</title><desc id="d">Ilustración editorial con tasas, calendario y depósitos en verde oscuro y menta.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073f35"/><stop offset="1" stop-color="#0e6b5c"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e8f7f0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#002a22" flood-opacity=".22"/></filter></defs>
<rect width="1200" height="630" rx="32" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="180" fill="#00c896" opacity=".12"/><circle cx="100" cy="600" r="220" fill="#d9f2e7" opacity=".06"/>
