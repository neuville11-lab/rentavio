<title id="title">Laboral Kutxa: hasta 1.275 euros entre nómina y depósito</title><desc id="desc">Gráfico editorial en verde con dos recompensas: 400 euros brutos por nómina y hasta 875 euros brutos de intereses por un depósito.</desc>
