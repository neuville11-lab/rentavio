<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Depósito al 3,25 % TAE: mínimo de 50.000 euros</title>
<desc id="desc">Portada de Rentavio sobre el nuevo depósito de Finantia a seis meses, su importe mínimo de 50.000 euros y la comparación con una cuenta remunerada.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E6B5C"/><stop offset="1" stop-color="#073D35"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#E3F6EF"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#052A25" flood-opacity=".3"/></filter>
 <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#A8E6D2" opacity=".18"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/>
<circle cx="1080" cy="70" r="230" fill="#00C896" opacity=".09"/><circle cx="1040" cy="610" r="320" fill="#6CCEB0" opacity=".08"/>
<g font-family="Inter,Arial,sans-serif">
 <rect x="72" y="68" width="42" height="42" rx="12" fill="#00C896"/><path d="M85 97V80h8c4 0 6 2 6 5 0 3-2 5-5 5l6 7" fill="none" stroke="#073D35" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="127" y="96" fill="#D6EEE6" font-size="17" font-weight="700" letter-spacing="2">RENTAVIO · ACTUALIDAD DEL AHORRO</text>
 <text x="72" y="218" fill="#fff" font-size="66" font-weight="800" letter-spacing="-3">3,25 % TAE</text>
 <text x="76" y="278" fill="#A8E6D2" font-size="31" font-weight="700">¿Pero exige 50.000 €?</text>
 <text x="76" y="330" fill="#D6EEE6" font-size="21">Finantia ofrece seis meses al mismo tipo</text>
 <text x="76" y="362" fill="#D6EEE6" font-size="21">que una cuenta promocional de un año.</text>
 <rect x="76" y="425" width="186" height="45" rx="22" fill="#fff" opacity=".12"/><text x="169" y="454" fill="#fff" text-anchor="middle" font-size="15" font-weight="700">DEPÓSITO · 6 MESES</text>
</g>
<g filter="url(#shadow)" transform="translate(750 125) rotate(4 175 145)">
 <rect width="360" height="280" rx="25" fill="url(#paper)"/>
 <text x="30" y="49" fill="#4B564F" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1">DEPÓSITO JUMP</text>
 <text x="30" y="112" fill="#0E6B5C" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="800">3,25 %</text>
 <text x="33" y="142" fill="#68756D" font-family="Inter,Arial,sans-serif" font-size="15">TAE · seis meses</text>
 <line x1="30" y1="168" x2="330" y2="168" stroke="#DDE3DE"/>
 <text x="30" y="205" fill="#4B564F" font-family="Inter,Arial,sans-serif" font-size="14">Importe mínimo</text>
 <text x="30" y="246" fill="#B5740C" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">50.000 €</text>
</g>
<g transform="translate(780 460)">
 <rect width="286" height="63" rx="15" fill="#fff" opacity=".12"/>
 <circle cx="34" cy="31" r="14" fill="#00C896"/><path d="M27 31h14M34 24v14" stroke="#073D35" stroke-width="2.5" stroke-linecap="round"/>
 <text x="60" y="27" fill="#D6EEE6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">CUENTA REMUNERADA</text>
 <text x="60" y="47" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">3,25 % TAE · 1 año</text>
</g>
</svg>